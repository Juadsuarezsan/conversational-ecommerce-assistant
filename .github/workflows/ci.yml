name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          black --check src tests

      - name: Type check
        run: mypy --strict src
        continue-on-error: true   # tighten this once mypy passes clean

      - name: Tests
        run: pytest tests/unit -q --cov=src --cov-report=term-missing

      - name: Eval gate
        env:
          ANTHROPIC_API_KEY: ""
        run: python -m src.eval.runner --json > /tmp/eval.json && cat /tmp/eval.json | python -c "import sys,json; d=json.load(sys.stdin); assert d['overall']['rerank']['p_at_5'] >= 0.3, d"
