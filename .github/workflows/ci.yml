name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: lint · types · tests · eval
    runs-on: ubuntu-latest
    env:
      # Offline deterministic configuration: no keys, no Docker, no ML extras.
      EMBEDDING_BACKEND: hash
      RERANK_BACKEND: lexical
      VECTOR_STORE: in_memory
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev extras from pyproject)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy (strict)
        run: mypy --strict src/

      - name: Tests with coverage gate
        run: pytest -q --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Retrieval eval gate (deterministic fallback, in-memory store)
        run: python -m src.eval.runner --gate 0.3

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
