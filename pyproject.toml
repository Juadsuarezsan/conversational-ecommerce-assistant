[project]
name = "ecommerce-assistant"
version = "0.1.0"
description = "Conversational E-commerce Assistant — hybrid RAG over Instacart catalog"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Juan David Suárez Sandoval", email = "juadsuarezsan@unal.edu.co" }]
license = { text = "MIT" }

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "tenacity==9.0.0",
    "loguru==0.7.2",
    # LLM
    "anthropic==0.39.0",
    "langchain-anthropic==0.2.4",
    "langchain-core==0.3.15",
    "langgraph==0.2.45",
    # Embeddings (free + paid options)
    "sentence-transformers==3.2.1",
    "voyageai==0.3.2",
    # Retrieval
    "rank-bm25==0.2.2",
    "qdrant-client==1.12.0",
    "chromadb==0.5.13",
    "pgvector==0.3.6",
    # Databases
    "psycopg[binary,pool]==3.2.3",
    "redis==5.1.1",
    # Data
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    # Eval
    "ragas==0.2.6",
    "datasets==3.0.1",
    # Frontend (Streamlit + WebRTC for demo)
    "streamlit==1.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "respx==0.21.1",
    "ruff==0.6.9",
    "black==24.10.0",
    "mypy==1.11.2",
    "types-redis==4.6.0.20241004",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -ra"
filterwarnings = ["ignore::DeprecationWarning"]
