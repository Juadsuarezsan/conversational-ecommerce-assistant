services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce}"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_dev@postgres:5432/ecommerce
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      qdrant:   { condition: service_started }
      redis:    { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./src:/app/src
      - ./data:/app/data

  streamlit:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["8501:8501"]
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py
      - ./src:/app/src
    command: streamlit run /app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
